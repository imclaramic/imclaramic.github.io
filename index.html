    initAudio(); iosUnlock(); A.ac.resume();
    const t = A.ac.currentTime + 0.03;
    A.master.gain.setValueAtTime(soundOn ? 0.9 : 0, t);
    if (mode !== 'sleep') { kick(t, 0.8); burst(t, 0.1, 0.25); A.bedG.gain.linearRampToValueAtTime(0.14, t + 1.5); }
    else { A.bedG.gain.setValueAtTime(0, t + 2.4); A.bedG.gain.linearRampToValueAtTime(0.14, t + 4); }
    sndBtn.textContent = 'sound: ' + (soundOn ? 'on' : 'off');
  } catch (e) { A = null; }
}
['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => addEventListener(ev, unlockAudio, { capture:true }));
setTimeout(wake, 700);

document.querySelectorAll('nav button[data-locked]').forEach(b => b.addEventListener('click', () => {
  const tt = document.getElementById('toast');
  tt.textContent = b.dataset.m + ': module not installed';
  tt.classList.add('show'); blip(0.05); setTimeout(() => blip(0.04), 70);
  clearTimeout(tt._h); tt._h = setTimeout(() => tt.classList.remove('show'), 1400);
}));
const linksBtn = document.getElementById('linksBtn'), linksEl = document.getElementById('links');
linksBtn.addEventListener('click', e => {
  e.stopPropagation();
  const on = !linksEl.classList.contains('show');
  linksEl.style.top = (document.querySelector('nav').getBoundingClientRect().bottom + 22) + 'px';
  linksEl.classList.toggle('show', on); linksBtn.classList.toggle('on', on);
  blip(on ? 0.05 : 0.03);
});
document.addEventListener('click', e => { if (!linksEl.contains(e.target) && e.target !== linksBtn) { linksEl.classList.remove('show'); linksBtn.classList.remove('on'); } });
const sndBtn = document.getElementById('snd');
sndBtn.addEventListener('click', () => {
  if (sndBtn.textContent.includes('tap')) return;
  soundOn = !soundOn; sndBtn.textContent = 'sound: ' + (soundOn ? 'on' : 'off');
  if (A) A.master.gain.setTargetAtTime(soundOn ? 0.9 : 0, A.ac.currentTime, 0.05);
});
document.addEventListener('visibilitychange', () => { if (!A) return; if (document.hidden) { A.ac.suspend(); if (silentEl) silentEl.pause(); } else { A.ac.resume(); if (silentEl && soundOn) silentEl.play().catch(() => {}); } });

const clock = document.getElementById('clock');
const fmt = new Intl.DateTimeFormat('en-GB', { timeZone:'Europe/Rome', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
function tickClock() { checkSlot(); clock.textContent = MSG.name; }
let kickAt = -9999; function glitchKick() { kickAt = performance.now(); }

/* automatic cycle: readable, degrades, recomposes */
const CLEAN = 1.2, RAMP = 0.6, HOLD = 4.2, BACK = 3.2, P = CLEAN + RAMP + HOLD + BACK;
function cycle(s) {
  const u = s % P;
  if (u < CLEAN) return 0;
  if (u < CLEAN + RAMP) return ease((u - CLEAN)/RAMP);
  if (u < CLEAN + RAMP + HOLD) return 1;
  return 1 - ease((u - CLEAN - RAMP - HOLD)/BACK);
}

function glitchSlices(amount) {
  const n = Math.floor(amount*6);
  for (let i = 0; i < n; i++) {
    const h = 2 + Math.random()*16, y = Math.random()*H, dx = rnd(amount*40);
    cx.drawImage(cv, 0, y*DPR, W*DPR, h*DPR, dx, y, W, h);
    if (Math.random() < 0.35) { cx.globalCompositeOperation = 'multiply'; cx.fillStyle = SIG; cx.fillRect(0, y, W, h); cx.globalCompositeOperation = 'source-over'; }
    if (Math.random() < amount*0.25) { cx.fillStyle = SIG; cx.fillRect(Math.random()*W*0.7, y, 20 + Math.random()*W*0.5, Math.max(1, h*0.25)); }
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  cx.fillStyle = "#000"; cx.fillRect(0, 0, W, H);

  if (mode === 'sleep') {
    const breathe = 0.97 + 0.03*Math.sin(now/600)*0; // closed lid
    drawEye(0.985, 1);
    placeHint();
  } else if (mode === 'waking') {
    const s = (now - wakeAt)/1000;
    const lid = 0.985*(1 - eout((s - 0.08)/0.32));
    const punch = 1 + 0.06*Math.exp(-Math.max(0, s - 0.9)*9)*(s > 0.9 ? 1 : 0);
    const Z = punch*Math.exp(Math.log(16)*ein((s - 1.25)/0.62));
    if (s < 1.9) {
      drawEye(lid, Z);
      if (s < 0.2 || (s > 0.9 && s < 0.98) || (s > 1.8)) glitchSlices(0.9);
      if (s > 0.45 && s < 1.25) {
        cx.font = `700 15px "IBM Plex Mono", Menlo, "DejaVu Sans Mono", monospace`; cx.fillStyle = MUTED; cx.textAlign = 'center';
        const g = eyeGeom(); cx.fillText('initializing system' + '...'.slice(0, 1 + Math.floor(s*6) % 3), W/2, g.y0 + EYE.h*g.w + 48);
      }
    } else { mode = 'on'; onAt = now; document.body.classList.add('on'); }
  }

  if (mode === 'on') {
    const s = (now - onAt)/1000;
    PARAMS.forEach(p => { if (!p.held) p.v += (0 - p.v)*(1 - Math.exp(-dt/1.1)); if (p.v < 0.002 && !p.held) p.v = 0; });
    const fx = MSG.fx, ms = (now - msgAt)/1000;
    const d = fx === 'base' ? cycle(s) : 0;
    const kick = Math.max(0, 1 - (now - kickAt)/450);
    const u = s % P, pre = u < CLEAN ? Math.pow(u/CLEAN, 1.6) : 0; // build-up before the break
    const intro = 1 - ease(s/0.35); // short glitch on entering
    let fxN = 0, copies = [];
    if (fx === 'forget') { const u = ms % 9; fxN = (u > 1.4 && u < 4.8) ? 0.05 : (u > 6.4 && u < 7.8 ? 0.12 : 0); }
    if (fx === 'remember') { const u = ms % 9; fxN = (u > 7 && u < 7.7) ? 0.5 : 0; }
    if (fx === 'repeat') {
      const u = ms % 6;
      for (let k = 0; k < 5; k++) { const at = 1.2 + k*0.45; if (u > at) { const age = u - at, fade = u < 3.6 ? 1 : Math.max(0, 1 - (u - 3.6)/1.6);
        copies.push({ dy: (k % 2 ? -1 : 1)*Math.ceil((k+1)/2)*LH*(LINES.length + 0.9), a: (0.55 - k*0.08)*fade, fresh: age < 0.09 }); } }
      if (copies.some(c => c.fresh)) { fxN = 0.45; if (!frame._rep || now - frame._rep > 200) { frame._rep = now; blip(0.05); } }
    }
    const N = clamp(d*0.55 + PARAMS[0].v + fxN + kick*0.8);
    const D = clamp(d*0.6 + PARAMS[1].v);
    const L = clamp(d*0.35 + PARAMS[2].v);
    updateAudio(Math.max(N, pre*0.06), D, L);

    cx.font = `500 ${FS}px "IBM Plex Mono", Menlo, "DejaVu Sans Mono", monospace`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    const R = Math.min(W, H)*0.3;
    let swaps = 0;
    chars.forEach((c, i) => {
      // drift: each letter follows its own slow path away from home
      const tx = D*R*Math.sin(s*c.f1 + c.p1)*Math.sin(s*0.21 + i), ty = D*R*0.8*Math.cos(s*c.f2 + c.p2);
      c.vx += (tx - c.ox)*dt*5; c.vy += (ty - c.oy)*dt*5; c.vx *= 0.86; c.vy *= 0.86;
      c.ox += c.vx; c.oy += c.vy; c.rot = D*0.9*Math.sin(s*c.f2*2 + c.p1);
      // noise: glyph swaps and jitter
      if (c.ch !== ' ' && Math.random() < N*N*0.12) { c.g = GLYPHS[Math.floor(Math.random()*GLYPHS.length)]; c.gt = 0.05 + Math.random()*0.25; swaps++; }
      if (c.gt > 0) { c.gt -= dt; if (c.gt <= 0) c.g = null; }
      const jx = N > 0.05 ? rnd(N*5) : 0;
      const x = c.hx + c.ox + jx, y = c.hy + c.oy;
      c.hist.unshift([x, y, c.rot]); if (c.hist.length > 40) c.hist.pop();
      let glyph = c.g || c.ch, a = 1, mx = 0, my = 0;
      if (fx === 'forget') {
        const u = ms % 9, out = 1.5 + c.r*3.0, back = 6.5 + c.r*1.2;
        if (u > out && u < back) a = u < out + 0.3 ? (Math.random() < 0.5 ? 1 : 0.15) : 0;
        if (u >= back && u < back + 0.18) glyph = GLYPHS[Math.floor(Math.random()*GLYPHS.length)];
      }
      if (fx === 'remember') {
        const u = ms % 9, k = u < 3 ? ease(clamp((u - c.r*0.6)/2.4)) : (u < 7 ? 1 : (u < 7.6 ? 1 - ein((u - 7)/0.6) : 0));
        mx = (c.sx + 6*Math.sin(s*1.3 + c.p1))*(1 - k); my = (c.sy + 6*Math.cos(s*1.1 + c.p2))*(1 - k);
      }
      if (fx === 'repeat' && copies.some(cc => cc.fresh)) mx = rnd(7);
      const X = x + mx, Y = y + my;
      if (a === 0) return;
      copies.forEach(cc => { cx.globalAlpha = cc.a; cx.fillStyle = c.li ? SIG : INK; cx.fillText(glyph, X + (cc.fresh ? rnd(10) : 0), Y + cc.dy); });
      cx.globalAlpha = a;
      // delay: echoes trailing behind
      if (L > 0.02) for (let k = 1; k <= 4; k++) {
        const h = c.hist[Math.min(c.hist.length - 1, k*8)]; if (!h) break;
        cx.globalAlpha = L*0.42*(1 - k/5);
        cx.save(); cx.translate(h[0], h[1]); cx.rotate(h[2]); cx.fillStyle = k % 2 ? SIG : INK; cx.fillText(glyph, 0, 0); cx.restore();
      }
      cx.globalAlpha = 1;
      if (N > 0.08 && Math.random() < 0.15 + N*0.6) { cx.fillStyle = c.li ? INK : SIG; cx.fillText(glyph, X - 2 - N*6, Y + rnd(N*2)); }
      cx.save(); cx.translate(X, Y); cx.rotate(c.rot); const base = c.li ? SIG : INK, alt = c.li ? INK : SIG; cx.fillStyle = c.g ? alt : base; cx.fillText(glyph, 0, 0); cx.restore(); cx.globalAlpha = 1;
    });
    if (swaps && Math.random() < 0.5) blip(0.012 + N*0.03);
    if (N > 0.15) glitchSlices(N);
    if (N > 0.35) { // scanlines
      cx.fillStyle = 'rgba(0,0,0,' + (N*0.35) + ')';
      for (let y = 0; y < H; y += 3) cx.fillRect(0, y, W, 1);
    }
    if (Math.random() < N*0.05) { const t = A ? A.ac.currentTime : 0; burst(t, 0.04 + Math.random()*0.08, 0.06 + N*0.14, 1500 + Math.random()*4000); }
    drawFaders();
    if (Math.floor(now/250) !== frame._c) { frame._c = Math.floor(now/250); tickClock(); }
  }
  requestAnimationFrame(frame);
}

const dotsEl = document.getElementById('dots');
let dotsN = 0; (function dotsTick(){ dotsN = (dotsN + 1) % 4; dotsEl.textContent = '.'.repeat(dotsN); setTimeout(dotsTick, 450); })();
addEventListener('resize', resize);
(document.fonts ? document.fonts.load('300 28px "IBM Plex Mono"') : Promise.resolve()).catch(() => {}).then(() => {
  resize(); tickClock(); requestAnimationFrame(frame);
});
})();
</script>
